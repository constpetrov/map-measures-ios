name: FieldMeasures
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  FieldMeasures:
    type: application
    platform: iOS
    sources:
      - FieldMeasures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).FieldMeasures
        PRODUCT_NAME: FieldMeasures
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Field Measures
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Your location is used to place measurement points on the map.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  FieldMeasuresTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FieldMeasuresTests
    dependencies:
      - target: FieldMeasures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).FieldMeasuresTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FieldMeasures:
    build:
      targets:
        FieldMeasures: all
        FieldMeasuresTests: [test]
    run:
      commandLineArguments:
        "-SeedPoints 3000": false
        "-FailSaves": false
        "-FailExportWrite": false
    test:
      targets:
        - FieldMeasuresTests
